DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
    - 0.485
    - 0.456
    - 0.406
    - 0.485
    - 0.456
    - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
    - 0.229
    - 0.224
    - 0.225
    - 0.229
    - 0.224
    - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
      - LasHeR_train
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME:
      - LasHeR_test
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 10000
MODEL:
  SHARE_STUDENT: False
  PRETRAIN_FILE: ""
  RGB_BRANCH: ""
  TIR_BRANCH: ""
  RGB_TEACHER: "enabled"
  TIR_TEACHER: "enabled"
  NETWORK: CSTNet
  BACKBONE:
    CE_LOC: []      # here we close it.
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'  # choose between ALL, CTR_POINT, CTR_REC, GT_BOX
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    USE_PRETRAINED: False
    LOAD_MODE: 1
    PARAMS:
      pretrained: False
      rgbt_loc: []
      freeze_layer: []
    SEP_SEG: False
    CAT_MODE: 'direct'
  HEAD:
    # FUSION_OPT: add # add
    # TYPE: center_head
    # PARAMS:
    #   inplanes: 768
    #   channel: 256
    #   feat_sz: 16
    #   stride: 16
    TYPE: CENTER
    NUM_CHANNELS: 256
  EXTRA_MERGER: False
  RETURN_INTER: False
  RETURN_STAGES: [ 2, 5, 8, 11 ]
TRAIN:
  DROP_PATH_RATE: 0.1
  MASK_PROBABILITY: 1.
  INPUT_MASK_RATIO: 0.25
  LEARN:
    EPOCH: 10 # 20
    LR: 0.00002 #0.00002
    SEED: 24
    BATCH_SIZE: 64
    IOU_TYPE: wiou
    IOU_WEIGHT: 2.0
    L1_WEIGHT: 5.0
    WEIGHT_DECAY: 0.0001
  ACTOR:
    TYPE: 'CSTNet_Actor'
  PRETRAIN:
    SOT_MODEL: True
    SOT_PRETRAIN_FILE: ''
  OPTIMIZER:
    TYPE: ADAMW
    DECAY_RATE: 0.1
    BACKBONE_MULTIPLIER: 0.1
  SCHEDULER:
    TYPE: step
    LR_DROP_EPOCH: 7
  TRAINER:
    NUM_WORKER: 8
    VAL_EPOCH_INTERVAL: 5
    SAVE_INTERVAL: 1
    PRINT_INTERVAL: 50
    AMP:
      USED: True
      GRAD_CLIP_NORM: 0.1
  FREEZE:
    USED: False
    LAYERS: [ 0, ]
TEST:
  EPOCH: 10
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
